<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XC Organiser</title>
<style>:root{
  --bg:#f4f5f2; --panel:#fff; --ink:#1d2320; --muted:#66706a; --line:#dfe3dc; --line2:#eef0ec;
  --accent:#1f6b45; --accent-2:#e7f2ec; --accent-ink:#fff; --warn:#a86200; --warn-bg:#fff4e0;
  --err:#b42318; --err-bg:#fdecea; --ok:#1f6b45; --ok-bg:#e7f4ec; --focus:#2f80ed;
  --radius:8px; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif; font-size:14px; color:var(--ink);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;background:#16301f;color:#fff}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:#3fa06a;font-weight:800;letter-spacing:.5px}
.brand-name{font-weight:700;line-height:1.1}
.brand-sub{font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.top-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.topbar .btn{background:#2a5a3c;border-color:#2a5a3c;color:#fff}
.topbar .btn.ghost{background:transparent;border-color:#46624f;color:#dfe9e2}
.topbar .btn:hover{filter:brightness(1.15)}
.save-status{font-size:12px;opacity:.85;margin-right:6px}
.save-status.dirty{color:#ffd28a}
.tabs{display:flex;gap:2px;padding:0 12px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:11px 14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-weight:600}
.tabs button:hover{color:var(--ink)}
.tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:var(--line2);color:var(--muted);font-size:11px;line-height:18px;text-align:center}
.badge.err{background:var(--err);color:#fff}
main{flex:1;overflow:auto;padding:16px}
.wrap{max-width:1400px;margin:0 auto}
h2{font-size:20px;margin:0 0 4px}
h3{font-size:15px;margin:18px 0 8px}
.sub{color:var(--muted);margin:0 0 14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap;line-height:1.3}
.btn:hover{border-color:#b8c0b8;background:#fafbf9}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.danger{color:var(--err);border-color:#efc2bd}
.btn.small{padding:3px 8px;font-size:12px}
.btn.icon{padding:2px 7px}
.btn:disabled{opacity:.45;cursor:default}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus,.btn:focus-visible{outline:2px solid var(--focus);outline-offset:-1px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
label.f > input,label.f > select,label.f > textarea{font-size:14px;color:var(--ink);font-weight:400}
label.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer;user-select:none}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
table.t{border-collapse:collapse;width:100%;background:#fff}
table.t th,table.t td{border-bottom:1px solid var(--line2);padding:5px 8px;text-align:left;vertical-align:middle}
table.t th{position:sticky;top:0;background:#f7f8f6;font-size:12px;color:var(--muted);font-weight:700;z-index:1;border-bottom:1px solid var(--line)}
table.t tr.clickable{cursor:pointer}
table.t tr.clickable:hover td{background:#f6faf7}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
table.t td.c,table.t th.c{text-align:center}
table.t input[type=text]{width:100%;padding:3px 6px}
.tbl-wrap{border:1px solid var(--line);border-radius:var(--radius);overflow:auto;max-height:calc(100vh - 260px);background:#fff}
td.bad{background:var(--err-bg)!important;color:var(--err)}
td.warnc{background:var(--warn-bg)!important}
tr.err td{background:var(--err-bg)}
tr.warn td{background:var(--warn-bg)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:var(--line2);color:var(--muted);margin:1px 2px 1px 0}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.err{background:var(--err-bg);color:var(--err)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill .x{cursor:pointer;margin-left:4px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:12px}
.stat{display:flex;flex-direction:column;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;min-width:120px}
.stat b{font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.notice{padding:10px 12px;border-radius:8px;background:var(--accent-2);border:1px solid #cfe5d8;margin-bottom:12px}
.notice.warn{background:var(--warn-bg);border-color:#f1d9ae}
.notice.err{background:var(--err-bg);border-color:#f3c7c2}
.empty{padding:40px;text-align:center;color:var(--muted)}
/* modal */
.modal-back{position:fixed;inset:0;background:rgba(20,30,24,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:10px;width:min(560px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;max-height:calc(100vh - 60px)}
.modal.wide{width:min(1300px,100%)}
.modal header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal header h3{margin:0;flex:1}
.modal .body{padding:16px 18px;overflow:auto}
.modal footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.paste-zone{width:100%;min-height:180px;border:2px dashed #b9c9bd;border-radius:10px;padding:14px;background:#fbfdfb;resize:vertical;font-family:Consolas,monospace;font-size:12px}
.paste-zone:focus{border-color:var(--accent);outline:none;background:#fff}
.map-table th select{width:100%;font-weight:600;font-size:12px;padding:3px}
.map-table td{font-size:12px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.fix-list{display:grid;grid-template-columns:minmax(160px,1fr) 30px minmax(220px,1.4fr) auto;gap:6px 8px;align-items:center}
.fix-list .arrow{text-align:center;color:var(--muted)}
/* toast */
#toast-root{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:80}
.toast{background:#16301f;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:var(--shadow);max-width:420px}
.toast.err{background:var(--err)}
/* results */
.res-layout{display:grid;grid-template-columns:minmax(420px,1fr) minmax(380px,1fr);gap:14px;align-items:start}
@media (max-width:1000px){.res-layout{grid-template-columns:1fr}}
.event-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.event-pill{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;text-align:left;line-height:1.2}
.event-pill.active{border-color:var(--accent);background:var(--accent-2);box-shadow:inset 0 0 0 1px var(--accent)}
.event-pill small{display:block;color:var(--muted);font-size:11px}
.bib-entry{display:flex;gap:8px;align-items:flex-end;padding:12px;background:#f3f8f4;border:1px solid #d5e6da;border-radius:8px;margin-bottom:10px}
.bib-entry input.bib{font-size:24px;width:130px;font-weight:700;padding:6px 10px}
.bib-entry input.time{font-size:18px;width:130px}
.last-added{font-size:13px;min-height:20px;margin:-4px 0 8px}
.score-block{margin-bottom:18px}
.score-block h4{margin:0 0 6px;font-size:14px;display:flex;gap:8px;align-items:center}
.lines-table td{padding:3px 6px}
.lines-table input.cell{border:1px solid transparent;background:transparent;width:70px;padding:2px 4px;border-radius:4px}
.lines-table input.cell:hover{border-color:var(--line)}
.lines-table input.cell:focus{background:#fff;border-color:var(--focus)}
.subtabs{display:flex;gap:6px;margin-bottom:12px}
.subtabs button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 14px;cursor:pointer}
.subtabs button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.report{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px 22px;max-height:calc(100vh - 250px);overflow:auto}
.report h1{font-size:18px;margin:0 0 2px}
.report .rh{color:var(--muted);margin-bottom:14px}
.report h2{font-size:15px;margin:18px 0 6px;padding-bottom:3px;border-bottom:2px solid var(--ink)}
.report table{border-collapse:collapse;width:100%;margin-bottom:6px}
.report td,.report th{border-bottom:1px solid #e5e5e5;padding:3px 6px;text-align:left;font-size:13px}
.report th{font-size:11px;text-transform:uppercase;color:#555}
.report .checkbox{width:14px;height:14px;border:1px solid #666;display:inline-block}
.report table.boxed td,.report table.boxed th{border:1px solid #999}
.report .total{font-weight:600;color:#444}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:12px;background:#fff}
#print-root{display:none}
@media print{
  @page{margin:12mm}
  body{background:#fff}
  #app,#modal-root,#toast-root{display:none!important}
  #print-root{display:block}
  #print-root .report{border:0;padding:0;max-height:none;overflow:visible}
  #print-root .page-break{break-after:page}
  #print-root h2{break-after:avoid}
  #print-root tr{break-inside:avoid}
}

.tabs button:disabled{opacity:.35;cursor:default}
.tabs button[data-tab=meets]{border-right:1px solid var(--line);margin-right:6px}
table.meets-table tr.current td{background:#f1f8f3}
table.meets-table td{padding:8px}

.topbar .sync-chip.err{border-color:#f0a8a0;color:#ffd0c8}

.topbar .update-pill{background:#2f5f8f;border-color:#2f5f8f;color:#fff}
.topbar .update-pill.ready{background:#e0a030;border-color:#e0a030;color:#1d2320;font-weight:700}
.topbar .update-pill.downloading,.topbar .update-pill.installing{opacity:.85;cursor:default}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="logo">XC</span><div><div class="brand-name">XC Organiser</div><div class="brand-sub" id="comp-title">—</div></div></div>
    <div class="top-actions">
      <span id="save-status" class="save-status"></span>
      <button id="update-pill" class="btn update-pill" data-act="upd-pill" hidden></button>
      <button id="sync-chip" class="btn ghost sync-chip" data-act="sync-open" hidden></button>
      <button class="btn ghost" data-act="export-all" data-needs-meet>Export to Excel</button>
      <button class="btn" data-act="meet-new">+ New meet</button>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-tab="meets">☰ Meets <span class="badge" id="badge-meets"></span></button>
    <button data-tab="comp">1 · Competition</button>
    <button data-tab="program">2 · Program</button>
    <button data-tab="entries">3 · Athletes <span class="badge" id="badge-entries"></span></button>
    <button data-tab="lists">4 · Lists &amp; booklet</button>
    <button data-tab="results">5 · Results &amp; scoring</button>
    <button data-tab="setup">Reference data</button>
  </nav>
  <main id="view"></main>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="print-root"></div>
<input type="file" id="file-open" accept=".json,application/json" multiple hidden>
<input type="file" id="file-import" accept=".xlsx,.xlsm,.csv,.txt,.tsv,.html,.htm" hidden>

<script>/* XC Organiser — core logic (no DOM). Works in browser and Node. */
(function (root) {
  'use strict';

  // ---------------------------------------------------------------- helpers
  const norm = s => String(s == null ? '' : s).replace(/ /g, ' ').replace(/[’`]/g, "'").replace(/\s+/g, ' ').trim();
  const lc = s => norm(s).toLowerCase();
  const stripAccents = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '');

  function levenshtein(a, b) {
    if (a === b) return 0;
    const m = a.length, n = b.length;
    if (!m) return n; if (!n) return m;
    let prev = new Array(n + 1), cur = new Array(n + 1);
    for (let j = 0; j <= n; j++) prev[j] = j;
    for (let i = 1; i <= m; i++) {
      cur[0] = i;
      for (let j = 1; j <= n; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      [prev, cur] = [cur, prev];
    }
    return prev[n];
  }

  // ---------------------------------------------------------------- clubs
  const CLUB_NOISE = /\b(a\.?\s?c\.?|athletics?|athletic|club|harriers?|running|road ?runners?|track|triathlon|t\.?c\.?|r\.?c\.?|and|&|the)\b/g;
  function clubKey(name) {
    let s = stripAccents(lc(name)).replace(/[.']/g, '').replace(/[^a-z0-9& ]+/g, ' ');
    return s.replace(/\s+/g, ' ').trim();
  }
  function clubCore(name) {
    return clubKey(name).replace(CLUB_NOISE, ' ').replace(/\s+/g, ' ').trim();
  }

  /** Build a matcher over known club names. match(text) -> {team, score, exact} | null */
  function makeClubMatcher(teams, aliases) {
    const list = teams.map(t => ({ t, key: clubKey(t.name), core: clubCore(t.name), code: lc(t.code) }));
    const byKey = new Map(), byCore = new Map(), byCode = new Map();
    for (const x of list) {
      if (!byKey.has(x.key)) byKey.set(x.key, x.t);
      if (x.core && !byCore.has(x.core)) byCore.set(x.core, x.t);
      if (x.code) byCode.set(x.code, x.t);
    }
    const alias = new Map(Object.entries(aliases || {}).map(([k, v]) => [clubKey(k), v]));
    return function match(text) {
      const raw = norm(text);
      if (!raw) return null;
      const k = clubKey(raw);
      if (alias.has(k)) {
        const t = teams.find(t => t.name === alias.get(k));
        if (t) return { team: t, score: 1, exact: true };
      }
      if (byKey.has(k)) return { team: byKey.get(k), score: 1, exact: true };
      if (byCode.has(lc(raw))) return { team: byCode.get(lc(raw)), score: 1, exact: true };
      const core = clubCore(raw);
      if (core && byCore.has(core)) return { team: byCore.get(core), score: 0.97, exact: false };
      let best = null;
      for (const x of list) {
        if (!x.core || !core) continue;
        const d = levenshtein(core, x.core);
        const score = 1 - d / Math.max(core.length, x.core.length);
        let s2 = score;
        // prefix / containment bonus ("Leevale" vs "Leevale A.C.")
        if (x.core.startsWith(core) || core.startsWith(x.core)) s2 = Math.max(s2, 0.9);
        if (!best || s2 > best.score) best = { team: x.t, score: s2, exact: false };
      }
      return best && best.score >= 0.6 ? best : null;
    };
  }

  // ---------------------------------------------------------------- gender / categories
  function parseGender(v) {
    const s = lc(v);
    if (!s) return '';
    if (/^(m|male|man|men|boy|boys|b|mens?|m\/b)$/.test(s)) return 'M';
    if (/^(f|w|female|woman|women|girl|girls|g|ladies|womens?|f\/g)$/.test(s)) return 'W';
    return '';
  }

  const CAT_WORDS = { snr: 'senior', sen: 'senior', jnr: 'junior', jr: 'junior', jun: 'junior', int: 'inter', nov: 'novice',
    vets: 'masters', vet: 'masters', veterans: 'masters', master: 'masters', mst: 'masters', mas: 'masters' };
  function catTokens(text) {
    let s = stripAccents(lc(text))
      .replace(/under[\s-]*(\d+)/g, 'u$1').replace(/over[\s-]*(\d+)/g, 'o$1')
      .replace(/\b([uo])[\s-]+(\d+)/g, '$1$2')
      .replace(/\b([uo])(\d+)(?:'?s)\b/g, '$1$2')            // U12s / U12's
      .replace(/\b([uo])(\d+)([gbmfw])\b/g, '$1$2 $3')         // U12G / U12B / O35M
      .replace(/\b([mwf])(\d{2})\b/g, (m, g, n) => (+n >= 30 && +n <= 95 ? `masters ${g} o${n}` : m)) // M35 / W40 / F45
      .replace(/[^a-z0-9& ]+/g, ' ');
    const out = new Set();
    let gender = '', style = '';
    for (let w of s.split(/\s+/)) {
      if (!w || w === '&' || w === 'and') continue;
      w = CAT_WORDS[w] || w;
      const g = parseGender(w);
      if (/^(men|mens|women|womens|ladies|male|female)$/.test(w)) style = 'adult';
      else if (/^(boys|girls|boy|girl)$/.test(w)) style = 'youth';
      if (g) { gender = gender && gender !== g ? 'X' : g; continue; }
      out.add(w);
    }
    // "Masters Men 35" -> o35
    if (out.has('masters')) for (const w of [...out]) if (/^\d{2}$/.test(w) && +w >= 30 && +w <= 95) { out.delete(w); out.add('o' + w); }
    return { tokens: out, gender, style };
  }

  /** match(text, genderHint) -> category name or ''. prefer: Set of names to favour when several fit (e.g. on the program). */
  function makeCategoryMatcher(cats, prefer) {
    const exact = new Map(cats.map(c => [lc(c.name), c.name]));
    const list = cats.map(c => {
      const t = catTokens(c.name);
      return { name: c.name, tokens: t.tokens, gender: c.gender || t.gender, style: t.style, code: lc(c.code) };
    });
    const pick = (cands, g, style) => {
      if (cands.length > 1 && g) { const gc = cands.filter(c => c.gender === g); if (gc.length) cands = gc; }
      if (cands.length > 1 && style) { const sc = cands.filter(c => c.style === style); if (sc.length) cands = sc; }
      if (cands.length > 1 && prefer && prefer.size) { const pc = cands.filter(c => prefer.has(c.name)); if (pc.length) cands = pc; }
      return cands.length === 1 ? cands[0].name : '';
    };
    return function match(text, genderHint) {
      const raw = norm(text);
      if (!raw) return '';
      if (exact.has(lc(raw))) return exact.get(lc(raw));
      const t = catTokens(raw);
      const g = (t.gender === 'X' ? '' : t.gender) || parseGender(genderHint);
      // team categories (e.g. "Men O35 Team") are only for team scoring, never an athlete's own category
      const pool = list.filter(c => (t.tokens.has('team') || !c.tokens.has('team')) && (!g || !c.gender || c.gender === g));
      const same = (a, b) => a.size === b.size && [...a].every(x => b.has(x));
      let cands = pool.filter(c => same(c.tokens, t.tokens));
      if (!cands.length && t.tokens.size) {
        // text tokens are a subset (e.g. "U12" + gender, "O35 Men" -> Masters Men O35)
        cands = pool.filter(c => [...t.tokens].every(x => c.tokens.has(x)) && (!g || c.gender === g));
        if (cands.length > 1) { const min = Math.min(...cands.map(c => c.tokens.size)); cands = cands.filter(c => c.tokens.size === min); }
      }
      return pick(cands, g, t.style);
    };
  }

  function catDobRange(cat, year) {
    if (!cat.dobFrom || !cat.dobTo || cat.age == null) return null;
    const mk = r => new Date(Date.UTC(year + r.yearOffset - cat.age, r.month - 1, r.day));
    // offsets are relative to (year - age); stored as yearOffset where date year = year + yearOffset - age
    return [mk(cat.dobFrom), mk(cat.dobTo)];
  }

  /** Pick the narrowest category whose DOB range contains dob, matching gender. preferNames: categories in program. */
  function categoryFromDob(cats, dobIso, gender, year, preferNames) {
    if (!dobIso || !gender) return '';
    const d = new Date(dobIso + 'T00:00:00Z');
    if (isNaN(d)) return '';
    let best = null;
    for (const c of cats) {
      if (c.gender !== gender) continue;
      const r = catDobRange(c, year);
      if (!r || d < r[0] || d > r[1]) continue;
      const span = r[1] - r[0];
      const pref = preferNames && preferNames.has(c.name) ? 0 : 1;
      if (!best || pref < best.pref || (pref === best.pref && span < best.span)) best = { c, span, pref };
    }
    return best ? best.c.name : '';
  }

  // ---------------------------------------------------------------- dates
  function parseDate(v) {
    if (v == null || v === '') return '';
    if (typeof v === 'number' && v > 1000 && v < 80000) { // Excel serial
      const d = new Date(Date.UTC(1899, 11, 30) + v * 86400000);
      return d.toISOString().slice(0, 10);
    }
    const s = norm(v);
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
    m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/); // Irish/UK: d/m/y
    if (m) {
      let y = +m[3]; if (y < 100) y += y > 30 ? 1900 : 2000;
      let d = +m[1], mo = +m[2];
      if (mo > 12 && d <= 12) [d, mo] = [mo, d];
      if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31) return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    }
    m = s.match(/^(\d{1,2})(?:st|nd|rd|th)?[\s\-\/.]+([a-z]{3,})[\s\-\/.,]+(\d{2,4})$/i);
    if (m) {
      const mo = 'janfebmaraprmayjunjulaugsepoctnovdec'.indexOf(m[2].slice(0, 3).toLowerCase()) / 3 + 1;
      let y = +m[3]; if (y < 100) y += y > 30 ? 1900 : 2000;
      if (mo > 0) return `${y}-${String(mo).padStart(2, '0')}-${m[1].padStart(2, '0')}`;
    }
    if (/^\d{5}$/.test(s)) return parseDate(+s);
    return '';
  }
  const looksDate = v => !!parseDate(v) && !/^\d{1,4}$/.test(norm(v));

  // ---------------------------------------------------------------- names
  function titleCase(w) {
    return w.toLowerCase().replace(/(^|[\s\-'])(\p{L})/gu, (m, a, b) => a + b.toUpperCase())
      .replace(/\bMc(\p{L})/gu, (m, a) => 'Mc' + a.toUpperCase());
  }
  /** returns "First SURNAME" */
  function formatName(first, last, upperSurname) {
    first = norm(first); last = norm(last);
    if (upperSurname) {
      last = last.toUpperCase();
      if (first === first.toUpperCase() && first.length > 1) first = titleCase(first);
    }
    return [first, last].filter(Boolean).join(' ');
  }
  function splitFullName(full) {
    full = norm(full);
    if (!full) return ['', ''];
    if (full.includes(',')) { // "SURNAME, First"
      const [l, f] = full.split(',').map(norm);
      return [f, l];
    }
    const w = full.split(' ');
    if (w.length === 1) return [w[0], ''];
    const isUp = x => x.length > 1 && x === x.toUpperCase() && /\p{L}/u.test(x);
    // "SURNAME First" (surname in capitals first)
    if (isUp(w[0]) && !isUp(w[w.length - 1])) {
      let i = 0; while (i < w.length - 1 && isUp(w[i])) i++;
      return [w.slice(i).join(' '), w.slice(0, i).join(' ')];
    }
    // "First SURNAME" with multi-word capitals at end
    if (isUp(w[w.length - 1])) {
      let i = w.length - 1; while (i > 0 && isUp(w[i - 1])) i--;
      return [w.slice(0, i).join(' '), w.slice(i).join(' ')];
    }
    // surname particles
    const parts = ['o', "o'", 'mac', 'mc', 'de', 'ni', 'nic', 'ui', 'van', 'von', 'di', 'da', 'le', 'la', 'ó', 'ní', 'uí'];
    let i = w.length - 1;
    while (i > 1 && parts.includes(w[i - 1].toLowerCase())) i--;
    return [w.slice(0, i).join(' '), w.slice(i).join(' ')];
  }

  // ---------------------------------------------------------------- tabular parsing
  function parseDelimited(text) {
    text = String(text || '').replace(/\r\n?/g, '\n');
    const lines = text.split('\n');
    const hasTab = lines.some(l => l.includes('\t'));
    if (hasTab) return lines.map(l => l.split('\t').map(norm));
    const nonEmpty = lines.filter(l => l.trim());
    const commaRows = nonEmpty.filter(l => l.includes(',')).length;
    if (nonEmpty.length && commaRows / nonEmpty.length > 0.8 && nonEmpty.some(l => l.split(',').length > 2)) return parseCSV(text);
    // runs of 2+ spaces as separators (copied from PDF / fixed width)
    if (nonEmpty.some(l => / {2,}/.test(l.trim()))) return lines.map(l => l.trim().split(/ {2,}/).map(norm));
    return lines.map(l => [norm(l)]);
  }
  function parseCSV(text) {
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += ch;
      } else if (ch === '"') q = true;
      else if (ch === ',') { row.push(norm(cell)); cell = ''; }
      else if (ch === '\n') { row.push(norm(cell)); rows.push(row); row = []; cell = ''; }
      else if (ch !== '\r') cell += ch;
    }
    row.push(norm(cell)); rows.push(row);
    return rows;
  }
  /** rows from clipboard HTML (tables). Non-table block lines become 1-cell rows (section headings). */
  function parseHtmlTables(html, DOMParserCtor) {
    const doc = new (DOMParserCtor || root.DOMParser)().parseFromString(html, 'text/html');
    const tables = doc.querySelectorAll('table');
    if (!tables.length) return null;
    const rows = [];
    const walk = node => {
      for (const ch of node.children) {
        const tag = ch.tagName;
        if (tag === 'TABLE') {
          const cap = ch.querySelector('caption');
          if (cap && norm(cap.textContent)) rows.push([norm(cap.textContent)]);
          for (const tr of ch.querySelectorAll('tr')) {
            if (tr.closest('table') !== ch) continue;
            const cells = [...tr.children].filter(c => c.tagName === 'TD' || c.tagName === 'TH');
            const r = [];
            for (const c of cells) {
              const v = norm(c.textContent);
              const span = Math.min(+c.getAttribute('colspan') || 1, 20);
              r.push(v); for (let k = 1; k < span; k++) r.push('');
            }
            if (r.some(Boolean)) rows.push(r);
          }
        } else if (/^H[1-6]$|^P$|^CAPTION$|^STRONG$|^B$/.test(tag) && !ch.querySelector('table')) {
          const t = norm(ch.textContent);
          if (t && t.length < 80) rows.push([t]);
        } else walk(ch);
      }
    };
    walk(doc.body);
    return rows;
  }

  // ---------------------------------------------------------------- column detection
  const FIELDS = [
    ['ignore', '— ignore —'], ['id', 'ID / Bib #'], ['name', 'Full name'], ['first', 'First name'], ['last', 'Surname'],
    ['gender', 'Gender'], ['dob', 'Date of birth'], ['category', 'Age category'], ['team', 'Club / Team'],
    ['scoringTeam', 'Scoring team'], ['county', 'County'], ['province', 'Province'], ['reg', 'Reg / Licence #'],
    ['mastersTeam', 'Masters club team'], ['mastersCountyTeam', 'Masters county team'], ['position', 'Position (skip)'],
  ];
  const HEADER_SYNONYMS = {
    id: /^(id|bib|bib ?no|bib ?number|number|no\.?|#|comp ?#|comp ?no|race ?no|race ?number|competitor ?(no|number))$/,
    name: /^(name|full ?name|athlete|athlete ?name|competitor|runner|participant|athlete'?s name)$/,
    first: /^(first|first ?name|firstname|forename|given ?name|christian ?name)$/,
    last: /^(last|last ?name|lastname|surname|family ?name|second ?name)$/,
    gender: /^(gender|sex|m\/f|g|male\/female)$/,
    dob: /^(dob|d\.o\.b\.?|date ?of ?birth|birth ?date|birthdate|born|yob)$/,
    category: /^(cat|category|age ?cat|age ?category|age ?group|agegroup|class|division|race|event|grade)$/,
    team: /^(club|team|club ?name|team ?name|affiliation|display ?team|club\/team|club \/ school|school)$/,
    scoringTeam: /^(scoring ?team|team ?scoring|team ?scoring ?name|scoring ?club)$/,
    county: /^(county|county ?scoring ?name|co\.?)$/,
    province: /^(province|province ?scoring ?name|region)$/,
    reg: /^(reg|reg ?#|reg ?no|registration|registration ?(no|number)|licence|license|licence ?no|aai ?(no|number)|member ?(no|number|id)|membership ?(no|number))$/,
    mastersTeam: /^(masters ?club ?team|masters ?team)$/,
    mastersCountyTeam: /^(masters ?county ?team)$/,
    position: /^(pos|position|place|plc|rank)$/,
  };
  function headerField(h) {
    const s = lc(h).replace(/[:*]/g, '').trim();
    for (const [f, re] of Object.entries(HEADER_SYNONYMS)) if (re.test(s)) return f;
    return null;
  }

  /**
   * Analyse pasted rows. Returns {headerIndex, mapping[], width}
   * ctx: {clubMatch, catMatch}
   */
  function detectColumns(rows, ctx) {
    const width = Math.max(0, ...rows.map(r => r.length));
    let headerIndex = -1, mapping = new Array(width).fill('ignore');
    for (let i = 0; i < Math.min(rows.length, 15); i++) {
      const r = rows[i];
      if (r.filter(Boolean).length < 2) continue;
      const fs = r.map(headerField);
      if (fs.filter(Boolean).length >= 2) {
        headerIndex = i;
        const used = new Set();
        mapping = new Array(width).fill('ignore').map((_, j) => {
          const f = fs[j];
          if (!f || used.has(f)) return 'ignore';
          used.add(f); return f;
        });
        break;
      }
    }
    if (headerIndex < 0) mapping = guessByContent(rows, width, ctx);
    // a "category"/"event" column that actually holds clubs? leave to user.
    return { headerIndex, mapping, width };
  }

  function guessByContent(rows, width, ctx) {
    const data = rows.filter(r => r.filter(Boolean).length >= 2).slice(0, 200);
    const score = [];
    for (let j = 0; j < width; j++) {
      const vals = data.map(r => r[j] || '').filter(Boolean);
      const n = vals.length || 1;
      const frac = f => vals.filter(f).length / n;
      score.push({
        j, n: vals.length,
        num: frac(v => /^\d{1,6}$/.test(v)),
        seq: (() => { const nums = vals.map(Number); let s = 0; for (let k = 1; k < nums.length; k++) if (nums[k] === nums[k - 1] + 1) s++; return nums.length > 2 ? s / (nums.length - 1) : 0; })(),
        date: frac(looksDate),
        gender: frac(v => !!parseGender(v)),
        club: ctx && ctx.clubMatch ? frac(v => { const m = ctx.clubMatch(v); return m && m.score > 0.85; }) : 0,
        cat: ctx && ctx.catMatch ? frac(v => !!ctx.catMatch(v)) : 0,
        alpha: frac(v => /\p{L}/u.test(v) && !/\d/.test(v)),
        words: vals.reduce((a, v) => a + v.split(' ').length, 0) / n,
        time: frac(v => /^\d{1,2}:\d{2}(:\d{2})?([.,]\d+)?$/.test(v)),
      });
    }
    const mapping = new Array(width).fill('ignore');
    const take = (field, pick) => {
      const c = score.filter(s => mapping[s.j] === 'ignore' && s.n > 0).sort((a, b) => pick(b) - pick(a))[0];
      if (c && pick(c) > 0.6) mapping[c.j] = field;
    };
    take('dob', s => s.date);
    take('gender', s => s.gender);
    take('category', s => s.cat);
    take('team', s => s.club);
    // positions are sequential numbers in the first column; ids are numbers
    const firstNum = score.find(s => s.num > 0.9 && mapping[s.j] === 'ignore');
    if (firstNum && firstNum.seq > 0.9 && score.filter(s => s.num > 0.9 && mapping[s.j] === 'ignore').length > 1) mapping[firstNum.j] = 'position';
    take('id', s => s.num);
    // names: alphabetic columns not yet used
    const alphaCols = score.filter(s => mapping[s.j] === 'ignore' && s.alpha > 0.8);
    if (alphaCols.length >= 2 && alphaCols[0].words < 1.6 && alphaCols[1].words < 2.2 && alphaCols[1].j === alphaCols[0].j + 1) {
      // two adjacent single-word columns -> first/last (or last/first if first col is ALL CAPS)
      const a = alphaCols[0], b = alphaCols[1];
      const upA = data.filter(r => r[a.j] && r[a.j] === r[a.j].toUpperCase()).length / (a.n || 1);
      const upB = data.filter(r => r[b.j] && r[b.j] === r[b.j].toUpperCase()).length / (b.n || 1);
      if (upA > 0.7 && upB < 0.5) { mapping[a.j] = 'last'; mapping[b.j] = 'first'; }
      else { mapping[a.j] = 'first'; mapping[b.j] = 'last'; }
    } else if (alphaCols.length) {
      const best = alphaCols.sort((x, y) => Math.abs(x.words - 2) - Math.abs(y.words - 2))[0];
      mapping[best.j] = 'name';
    }
    return mapping;
  }

  /**
   * Convert pasted rows to athlete records.
   * opts: {mapping, headerIndex, upperSurname, defaultCategory, defaultTeam, detectFromDob, year, programCats:Set, clubMatch, catMatch, cats, teams}
   * returns [{rowIndex, raw, rec:{...}, section:{category, team}}]
   */
  function rowsToRecords(rows, opts) {
    const out = [];
    const m = opts.mapping;
    const colOf = f => m.indexOf(f);
    const headerRow = opts.headerIndex >= 0 ? rows[opts.headerIndex].map(lc).join('|') : null;
    let secCat = '', secTeam = '', secGender = '';
    for (let i = 0; i < rows.length; i++) {
      if (i === opts.headerIndex) continue;
      const r = rows[i];
      const filled = r.filter(Boolean);
      if (!filled.length) continue;
      if (headerRow && r.map(lc).join('|') === headerRow) continue; // repeated header
      // section headings (one or two cells): category or club
      if (filled.length <= 2 && !(colOf('name') >= 0 && filled.length === 2 && r[colOf('name')])) {
        const text = filled.join(' ');
        const c = opts.catMatch(text);
        if (c) { secCat = c; continue; }
        const g = catTokens(text).gender;
        const cm = opts.clubMatch(text);
        if (cm && cm.score >= 0.85 && filled.length === 1) { secTeam = cm.team.name; continue; }
        if (filled.length === 1 && !/\d{3,}/.test(text) && text.split(' ').length > 1 && text.split(' ').length < 8 && colOf('name') !== r.indexOf(filled[0]) && colOf('first') < 0) {
          // unknown heading: maybe gender-only heading like "Girls"
          if (g && g !== 'X') secGender = g;
          continue;
        }
        if (filled.length === 1 && colOf('name') < 0 && colOf('first') < 0) continue;
      }
      const get = f => { const j = colOf(f); return j >= 0 ? norm(r[j]) : ''; };
      let first = get('first'), last = get('last');
      if (!first && !last) [first, last] = splitFullName(get('name'));
      else if (!last && first) [first, last] = splitFullName(first);
      if (!first && !last) continue;
      if (/^(total|totals|entries|count)\b/i.test(first)) continue;
      const gender = parseGender(get('gender')) || secGender;
      const dob = parseDate(colOf('dob') >= 0 ? r[colOf('dob')] : '');
      let catText = get('category');
      let category = catText ? opts.catMatch(catText, gender) : '';
      let catSource = category ? 'column' : '';
      if (!category && secCat) {
        // section heading may be generic (e.g. "U12") -> combine with gender
        category = opts.catMatch(secCat, gender) || secCat; catSource = 'heading';
      }
      if (!category && opts.detectFromDob && dob && gender) { category = categoryFromDob(opts.cats, dob, gender, opts.year, opts.programCats); if (category) catSource = 'dob'; }
      if (!category && opts.defaultCategory) { category = opts.defaultCategory; catSource = 'default'; }
      const teamText = get('team') || secTeam || opts.defaultTeam || '';
      const idText = get('id');
      const rec = {
        id: /^\d+$/.test(idText) ? +idText : null,
        name: formatName(first, last, opts.upperSurname),
        first, last, gender, dob, category, categoryText: catText || (catSource === 'heading' ? secCat : ''), catSource,
        teamText, reg: get('reg'), county: get('county'), province: get('province'),
        scoringTeamText: get('scoringTeam'), mastersTeam: get('mastersTeam'), mastersCountyTeam: get('mastersCountyTeam'),
      };
      out.push({ rowIndex: i, raw: r, rec });
    }
    return out;
  }

  // ---------------------------------------------------------------- scoring
  function teamKey(entry, type) {
    if (type === 'county') return norm(entry.county);
    if (type === 'province') return norm(entry.province);
    return norm(entry.scoringTeam || entry.team);
  }

  /** results: [{pos, entry}] already in finish order. Returns sorted team list. */
  function computeTeams(results, type, toScore, multi) {
    const teams = new Map();
    if (!toScore || toScore < 1) return [];
    for (const r of results) {
      const base = teamKey(r.entry, type);
      if (!base) continue;
      let t = teams.get(base);
      if (!t) { t = { name: base, positions: [], athletes: [] }; teams.set(base, t); }
      if (t.positions.length >= toScore) {
        if (!multi) continue;
        let i = 2;
        for (;;) {
          const k = base + ' ' + String.fromCharCode(64 + i); // "Club B", "Club C"
          let t2 = teams.get(k);
          if (!t2) { t2 = { name: k, positions: [], athletes: [] }; teams.set(k, t2); }
          if (t2.positions.length < toScore) { t = t2; break; }
          i++;
        }
      }
      t.positions.push(r.pos); t.athletes.push(r.entry);
    }
    const full = [...teams.values()].filter(t => t.positions.length === toScore).map(t => ({
      ...t, points: t.positions.reduce((a, b) => a + b, 0), last: t.positions[t.positions.length - 1],
    }));
    full.sort((a, b) => a.points - b.points || a.last - b.last);
    full.forEach((t, i) => { t.place = i + 1; t.tie = i > 0 && full[i - 1].points === t.points && full[i - 1].last === t.last; });
    return full;
  }

  /**
   * Score one race.
   * state: {settings, ageCategories, mastersTeamCategories, entries}
   * ev: program event {number, categories[], type}
   * rows: [{id, time}]
   */
  function scoreEvent(state, ev, rows, opts) {
    opts = opts || {};
    const unknownTakes = opts.unknownTakesPosition != null ? opts.unknownTakesPosition : state.settings.unknownTakesPosition !== false;
    const byId = new Map(state.entries.map(e => [String(e.id), e]));
    const catCfg = new Map(state.ageCategories.map(c => [c.name, c]));
    const evCats = new Set(ev.categories);
    const seen = new Map();
    const lines = [];
    let pos = 0;
    rows.forEach((r, i) => {
      const id = String(r.id == null ? '' : r.id).trim();
      const line = { index: i, id, time: r.time || '', entry: null, pos: null, error: '' };
      const e = byId.get(id);
      if (!id) line.error = 'No number';
      else if (seen.has(id)) { line.entry = e || null; line.error = `Duplicate — already in position ${seen.get(id)}`; }
      else if (!e) { line.error = 'Unknown number'; if (unknownTakes) { pos++; line.pos = pos; line.unscored = true; seen.set(id, pos); } }
      else if (!evCats.has(e.category)) { line.entry = e; line.error = `Wrong race — entered in ${e.category || 'no category'}`; if (unknownTakes) { pos++; line.pos = pos; line.unscored = true; seen.set(id, pos); } }
      else { line.entry = e; pos++; line.pos = pos; seen.set(id, pos); }
      lines.push(line);
    });
    const valid = lines.filter(l => l.pos && !l.unscored);
    const type = (ev.type || 'CC').toUpperCase() === 'RR' ? 'rr' : 'cc';
    const level = state.settings.regionLevel || 'Provincial';
    const doCounty = level === 'National' || level === 'Provincial';
    const doProvince = level === 'National';

    // ranking groups
    const groups = [];
    if (ev.categories.length > 1) {
      for (const c of ev.categories) {
        const cfg = catCfg.get(c);
        if (cfg && cfg.noOwnRanking) continue;
        groups.push({ category: c, results: [] });
      }
      for (const l of valid) {
        const cat = l.entry.category;
        const cfg = catCfg.get(cat) || {};
        const targets = new Set();
        if (!cfg.noOwnRanking) targets.add(cat);
        for (const s of cfg.scoresIn || []) {
          if (s === '*') groups.forEach(g => targets.add(g.category));
          else groups.forEach(g => { if (g.category === s || lc(cat).includes(lc(g.category)) && lc(g.category).includes(lc(s))) targets.add(g.category); });
        }
        for (const g of groups) if (targets.has(g.category)) g.results.push({ pos: g.results.length + 1, overall: l.pos, entry: l.entry, time: l.time });
      }
    } else {
      groups.push({ category: ev.categories[0], results: valid.map(l => ({ pos: l.pos, overall: l.pos, entry: l.entry, time: l.time })) });
    }
    for (const g of groups) {
      const cfg = (catCfg.get(g.category) || {})[type] || { club: 4, county: 6, province: 6 };
      g.config = cfg;
      g.teams = {
        club: computeTeams(g.results, 'club', cfg.club, cfg.clubMulti),
        county: doCounty ? computeTeams(g.results, 'county', cfg.county, cfg.countyMulti) : [],
        province: doProvince ? computeTeams(g.results, 'province', cfg.province, cfg.provinceMulti) : [],
      };
    }
    // masters team categories (positions = overall race positions, like the workbook)
    const masters = [];
    for (const mc of state.mastersTeamCategories || []) {
      const cfg = (catCfg.get(mc) || {})[type] || { club: 4, county: 4 };
      const clubRes = valid.filter(l => l.entry.mastersTeam === mc).map(l => ({ pos: l.pos, entry: l.entry }));
      const countyRes = valid.filter(l => l.entry.mastersCountyTeam === mc).map(l => ({ pos: l.pos, entry: l.entry }));
      if (!clubRes.length && !countyRes.length) continue;
      masters.push({
        category: mc,
        club: computeTeams(clubRes, 'club', cfg.club, cfg.clubMulti),
        county: doCounty ? computeTeams(countyRes, 'county', cfg.county || cfg.club, cfg.countyMulti) : [],
      });
    }
    return { lines, finishers: valid.length, errors: lines.filter(l => l.error).length, groups, masters };
  }

  // ---------------------------------------------------------------- validation
  function validate(state) {
    const issues = [];
    const cats = new Set(state.ageCategories.map(c => c.name));
    const teams = new Set(state.teams.map(t => t.name));
    const counties = new Set(state.counties);
    const provinces = new Set(state.provinces);
    const masters = new Set(state.mastersTeamCategories);
    const progCats = new Set(state.program.flatMap(p => p.categories));
    const idCount = new Map(), nameCat = new Map();
    for (const e of state.entries) {
      idCount.set(String(e.id), (idCount.get(String(e.id)) || 0) + 1);
      const k = lc(e.name) + '|' + e.category;
      nameCat.set(k, (nameCat.get(k) || 0) + 1);
    }
    for (const e of state.entries) {
      const add = (field, level, msg) => issues.push({ id: e.id, uid: e.uid, field, level, msg });
      if (e.id == null || e.id === '') add('id', 'error', 'Missing number');
      else if (idCount.get(String(e.id)) > 1) add('id', 'error', `Number ${e.id} is used more than once`);
      if (!norm(e.name)) add('name', 'error', 'Missing name');
      if (!e.category) add('category', 'error', 'No age category');
      else if (!cats.has(e.category)) add('category', 'error', `Unknown age category "${e.category}"`);
      else if (progCats.size && !progCats.has(e.category)) add('category', 'warn', `"${e.category}" is not in any race on the program`);
      if (e.team && !teams.has(e.team)) add('team', 'error', `Unknown club "${e.team}"`);
      if (e.scoringTeam && !teams.has(e.scoringTeam)) add('scoringTeam', 'error', `Unknown scoring team "${e.scoringTeam}"`);
      if (e.county && !counties.has(e.county)) add('county', 'error', `Unknown county "${e.county}"`);
      if (e.province && !provinces.has(e.province)) add('province', 'error', `Unknown province "${e.province}"`);
      if (e.mastersTeam && !masters.has(e.mastersTeam)) add('mastersTeam', 'error', `Unknown masters team category "${e.mastersTeam}"`);
      if (e.mastersCountyTeam && !masters.has(e.mastersCountyTeam)) add('mastersCountyTeam', 'error', `Unknown masters team category "${e.mastersCountyTeam}"`);
      if (norm(e.name) && nameCat.get(lc(e.name) + '|' + e.category) > 1) add('name', 'warn', 'Possible duplicate: same name in same category');
    }
    return issues;
  }

  // ---------------------------------------------------------------- XLSX writer (stored zip)
  const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  function crc32(buf) { let c = 0xFFFFFFFF; for (let i = 0; i < buf.length; i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
  function zipStore(files) {
    const enc = new TextEncoder();
    const parts = [], central = [];
    let offset = 0;
    for (const f of files) {
      const name = enc.encode(f.name);
      const data = typeof f.data === 'string' ? enc.encode(f.data) : f.data;
      const crc = crc32(data);
      const lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
      lh.setUint32(14, crc, true); lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true);
      parts.push(new Uint8Array(lh.buffer), name, data);
      const ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);

        if (manual) { Upd.msg = `You're up to date (version ${Upd.current}).`; renderUpdateRow(); }
        return;
      }
      if (Upd.state === 'ready' && Upd.info && Upd.info.version === info.version) { if (manual) { Upd.msg = ''; renderUpdateRow(); } return; }
      Upd.info = info; Upd.state = 'downloading'; Upd.pct = 0; Upd.msg = ''; renderChrome(); renderUpdateRow();

    modal('Import meet workbook', body, {
      wide: true, footer: '<button class="btn" data-c>Cancel</button><button class="btn primary" data-ok>Import as a new meet</button>', onMount: m => {
        const f = n => $(`[name=${n}]`, m.body);
        $('[data-c]', m.el).onclick = m.close;
        $('[data-ok]', m.el).onclick = async () => {
          const st = await baseState();
          if (f('ref').checked) for (const k of ['ageCategories', 'teams', 'mastersTeamCategories', 'counties', 'provinces']) if (meet[k] && meet[k].length) st[k] = meet[k];
          // make sure categories / counties used by the workbook exist even when keeping current reference data
          for (const c of meet.counties) if (!st.counties.includes(c)) st.counties.push(c);
          Object.assign(st.settings, meet.settings, { title: f('title').value.trim() || meet.settings.title, date: f('date').value || meet.settings.date });
          st.program = meet.program; st.results = meet.results;
          const entries = [...meet.entries, ...(lateN && f('late').checked ? report.lateEntries : [])];
          const done = migrate({ ...st, entries });
          m.close();
          await addMeet(done, 'entries');
          toast(`Imported “${done.settings.title}”: ${done.entries.length} athletes, ${report.finishers} finishers`);
        };
      },
    });
  }

  async function newMeetDialog(copyFromId) {

          if (!title) { toast('Give the meet a name', true); f('title').focus(); return; }

  // ================================================================ 2. program
  function viewProgram() {
    const d = derive();

    S.program.forEach(p => p.categories.forEach(c => used.set(c, (used.get(c) || 0) + 1)));

      const n = entriesFor(p).length;
      const dupl = p.categories.filter(c => used.get(c) > 1);
      return `<tr>
        <td style="width:70px"><input type="number" style="width:60px" data-pf="number" data-i="${i}" value="${esc(p.number)}"></td>
        <td>${p.categories.map((c, ci) => `<span class="pill ${dupl.includes(c) ? 'warn' : d.catByName.has(c) ? '' : 'err'}" title="${dupl.includes(c) ? 'This category is in more than one race' : ''}">${esc(c)}<span class="x" data-act="prog-delcat" data-i="${i}" data-ci="${ci}" title="Remove">×</span></span>`).join('')}
          <select data-act="prog-addcat" data-i="${i}" style="max-width:170px"><option value="">+ add category</option>${catOptions('', { blank: false })}</select></td>
        <td><select data-pf="type" data-i="${i}">${opt('CC', 'Cross country', p.type === 'CC')}${opt('RR', 'Road race', p.type === 'RR')}</select></td>

        <td style="white-space:nowrap"><button class="btn icon" data-act="prog-up" data-i="${i}" ${i ? '' : 'disabled'}>↑</button><button class="btn icon" data-act="prog-down" data-i="${i}" ${i < S.program.length - 1 ? '' : 'disabled'}>↓</button><button class="btn icon danger" data-act="prog-del" data-i="${i}">✕</button></td>

    return `<h2>Program</h2><p class="sub">Each row is one race. Put several age categories in the same race when they run together — they are still ranked and team-scored separately.</p>
      <div class="toolbar"><button class="btn primary" data-act="prog-add">+ Add race</button><button class="btn" data-act="prog-quick">Add one race per category…</button>

      ${S.program.length ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>Event #</th><th>Age categories</th><th>Type</th><th>Distance</th><th>Time</th><th class="num">Entered</th><th class="num">Finishers</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
      : `<div class="card empty">No races yet. Click <b>Add one race per category…</b> to build the program quickly.</div>`}`;

  function progQuick() {
    const d = derive();
    const groups = {};
    S.ageCategories.forEach(c => { const g = c.name.match(/^(U\d+|Masters|Intermediate|Novice|Senior|Junior|Minor|Inter)/i); const k = g ? g[1].replace(/^u/, 'U') : 'Other'; (groups[k] = groups[k] || []).push(c); });
    const body = `<p class="small muted">Tick the categories that run. Each one becomes its own race, using the distance from the reference data.</p>
      <div style="columns:3 200px;column-gap:20px">${Object.entries(groups).map(([g, cs]) => `<div style="break-inside:avoid;margin-bottom:10px"><b class="small">${esc(g)}</b><br>${cs.map(c => `<label class="chk small" style="display:flex"><input type="checkbox" value="${esc(c.name)}" ${d.progCats.has(c.name) ? 'disabled checked' : ''}> ${esc(c.name)} <span class="muted">${esc(c.ccDistance || '')}</span></label>`).join('')}</div>`).join('')}</div>`;
    modal('Add one race per category', body, {
      wide: true, footer: `<button class="btn" data-close2>Cancel</button><button class="btn primary" data-ok>Add races</button>`,
      onMount: m => {
        $('[data-close2]', m.el).onclick = m.close;
        $('[data-ok]', m.el).onclick = () => {
          const picked = $$('input:checked:not(:disabled)', m.body).map(i => i.value);
          let n = Math.max(0, ...S.program.map(p => +p.number || 0));
          for (const c of picked) {
            const cfg = d.catByName.get(c);
            S.program.push({ number: ++n, categories: [c], type: 'CC', distance: cfg ? cfg.ccDistance : '', time: '' });

  // ================================================================ 3. entries
  function filteredEntries() {
    const d = derive();
    const q = X.lc(ui.q);
    let list = S.entries.filter(e => {
      if (ui.fCat === '__none__' ? (e.category && d.catByName.has(e.category)) : (ui.fCat && e.category !== ui.fCat)) return false;
      if (ui.fTeam && e.team !== ui.fTeam) return false;
      if (ui.onlyProblems && !d.issuesByUid.has(e.uid)) return false;
      if (q && !(X.lc(e.name).includes(q) || X.lc(e.team).includes(q) || String(e.id) === q || X.lc(e.reg).includes(q))) return false;
      return true;
    });
    const catIdx = new Map(d.catOrder.map((c, i) => [c, i]));
    const sorters = {
      id: (a, b) => (a.id ?? 1e9) - (b.id ?? 1e9),
      name: (a, b) => surnameKey(a.name).localeCompare(surnameKey(b.name)),
      category: (a, b) => (catIdx.get(a.category) ?? 999) - (catIdx.get(b.category) ?? 999) || a.team.localeCompare(b.team) || surnameKey(a.name).localeCompare(surnameKey(b.name)),
      team: (a, b) => a.team.localeCompare(b.team) || (catIdx.get(a.category) ?? 999) - (catIdx.get(b.category) ?? 999) || surnameKey(a.name).localeCompare(surnameKey(b.name)),
    };
    return list.sort(sorters[ui.sort] || sorters.id);
  }

    return `<h2>Athletes</h2><p class="sub">Copy an entry list from any website or spreadsheet and paste it in. Click a row to edit an athlete.</p>
      ${errs.length ? `<div class="notice err"><b>${errs.length} problem${errs.length > 1 ? 's' : ''}</b> to fix (red cells) ${warns.length ? `and ${warns.length} warning${warns.length > 1 ? 's' : ''} (amber)` : ''}. <button class="btn small" data-act="ent-problems">${ui.onlyProblems ? 'Show all athletes' : 'Show only these'}</button> <button class="btn small" data-act="ent-issues">List problems</button>${fixable ? ` <button class="btn small primary" data-act="ent-autofix">Fix ${fixable} spelling difference${fixable > 1 ? 's' : ''}</button>` : ''}</div>`
      : warns.length ? `<div class="notice warn">${warns.length} warning${warns.length > 1 ? 's' : ''} (amber cells). <button class="btn small" data-act="ent-issues">List warnings</button></div>` : S.entries.length ? `<div class="notice">✓ All ${S.entries.length} entries check out.</div>` : ''}
      <div class="toolbar">
        <button class="btn primary" data-act="ent-paste">📋 Paste athletes…</button>
        <button class="btn" data-act="ent-file">Import file…</button>
        <button class="btn" data-act="ent-add">+ Add athlete</button>

        <select id="ent-cat"><option value="">All categories</option>${(() => { const n = S.entries.filter(e => !e.category || !d.catByName.has(e.category)).length; return n ? opt('__none__', `⚠ No / unknown category (${n})`, ui.fCat === '__none__') : ''; })()}${d.catOrder.filter(c => S.entries.some(e => e.category === c)).map(c => opt(c, `${c} (${S.entries.filter(e => e.category === c).length})`, ui.fCat === c)).join('')}</select>

      : `<div class="card empty"><p style="font-size:16px">No athletes yet.</p><p>Open the entry list on the website, select the table (drag across it or press <kbd>Ctrl</kbd>+<kbd>A</kbd>), copy with <kbd>Ctrl</kbd>+<kbd>C</kbd>, then click <b>Paste athletes</b>.</p><button class="btn primary" data-act="ent-paste">📋 Paste athletes…</button></div>`}`;

  function afterEntries() {
    const q = $('#ent-q');
    if (q) {
      q.oninput = () => { ui.q = q.value; const pos = q.selectionStart; render(); const q2 = $('#ent-q'); q2.focus(); q2.setSelectionRange(pos, pos); };
      $('#ent-cat').onchange = e => { ui.fCat = e.target.value; render(); };
      $('#ent-team').onchange = e => { ui.fTeam = e.target.value; render(); };
    }
    const all = $('#sel-all');
    if (all) all.onchange = () => { const list = filteredEntries(); if (all.checked) list.forEach(e => ui.sel.add(e.uid)); else list.forEach(e => ui.sel.delete(e.uid)); render(); };
    const t = $('#ent-table');
    if (t) t.addEventListener('click', e => {
      const th = e.target.closest('th[data-sort]'); if (th) { ui.sort = th.dataset.sort; render(); return; }
      const cb = e.target.closest('[data-sel]');
      if (cb) { cb.checked ? ui.sel.add(cb.dataset.sel) : ui.sel.delete(cb.dataset.sel); render(); return; }
      if (e.target.closest('[data-nosel]')) return;
      const tr = e.target.closest('tr[data-uid]'); if (tr) editAthlete(S.entries.find(x => x.uid === tr.dataset.uid));
    });
  }

        <label class="f">Masters county team<select name="mastersCountyTeam">${listOptions(S.mastersTeamCategories, a.mastersCountyTeam, 'None')}</select></label>

  /** Unknown club / county / province / category values that only differ in case, punctuation or spacing. */
  function autoFixes() {
    const d = derive(); const fixes = [];
    const simple = v => X.lc(v).replace(/[^a-z0-9]+/gi, '');
    const lookup = list => { const m = new Map(); for (const x of list) m.set(simple(x), x); return m; };
    const teams = lookup(S.teams.map(t => t.name)), counties = lookup(S.counties), provs = lookup(S.provinces), cats = lookup(S.ageCategories.map(c => c.name));
    for (const i of d.issues) {
      if (i.level !== 'error') continue;
      const e = S.entries.find(x => x.uid === i.uid); if (!e) continue;
      const v = e[i.field]; let to = null;
      if (i.field === 'team' || i.field === 'scoringTeam') { to = teams.get(simple(v)); if (!to) { const m = d.clubMatch(v); if (m && m.score >= 0.97) to = m.team.name; } }
      else if (i.field === 'county') to = counties.get(simple(v));
      else if (i.field === 'province') to = provs.get(simple(v));
      else if (i.field === 'category') to = cats.get(simple(v));
      if (to && to !== v) fixes.push({ e, field: i.field, from: v, to });
    }
    return fixes;
  }

  async function copyRich(html, text) {
    try {
      if (navigator.clipboard && window.ClipboardItem) {
        await navigator.clipboard.write([new ClipboardItem({ 'text/html': new Blob([html], { type: 'text/html' }), 'text/plain': new Blob([text], { type: 'text/plain' }) })]);
        return true;
      }
    } catch (e) { /* fall back */ }
    try {
      const div = document.createElement('div'); div.innerHTML = html; div.style.cssText = 'position:fixed;left:-9999px;top:0';
      document.body.appendChild(div);
      const r = document.createRange(); r.selectNodeContents(div);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      const ok = document.execCommand('copy'); sel.removeAllRanges(); div.remove();
      return ok;
    } catch (e) { return false; }
  }

  /** Open the email app with the list. Long lists are copied to the clipboard to paste in. */
  async function emailList(list, { club = '', to = '' } = {}) {
    if (!list.length) { toast('No athletes to email', true); return; }
    const subject = club ? `${club} — race numbers for ${S.settings.title}` : `Athlete numbers — ${S.settings.title}`;
    const text = listText(list, club);
    const enc = v => encodeURIComponent(v).replace(/%20/g, '%20');
    const base = `mailto:${to ? encodeURIComponent(to.trim()).replace(/%40/g, '@') : ''}?subject=${enc(subject)}`;
    let url = `${base}&body=${enc(text.replace(/\n/g, '\r\n'))}`;
    let pasted = false;
    if (url.length > MAILTO_MAX) {
      pasted = await copyRich(listHtml(list, club), text);
      url = `${base}&body=${enc((pasted ? 'Press Ctrl+V here to paste the list.' : 'The list was too long to add automatically.') + '\r\n\r\n')}`;
    }
    try { await openMailto(url); }
    catch (e) { toast('Could not open your email app: ' + (e.message || e), true); return; }
    if (pasted) modal('Email opened', `<p style="margin-top:0">The list of ${list.length} athletes is too long to put into the email automatically, so it's been <b>copied</b>.</p><p>In the new email, click in the message and press <kbd>Ctrl</kbd>+<kbd>V</kbd> to paste it.</p>`, { footer: '<button class="btn primary" data-close2>OK</button>', onMount: m => { $('[data-close2]', m.el).onclick = m.close; } });

  function afterResults() {
    const bib = $('#bib'); if (!bib) return;
    const time = $('#btime');
    if (!$('#modal-root').children.length) bib.focus();
    const add = () => {
      let v = bib.value.trim(); let t = time.value.trim();
      const m = v.match(/^(\S+)[\s,;]+(.+)$/); if (m) { v = m[1]; t = t || m[2]; }
      if (!v) return;
      const ev = currentEvent(); const rows = resultsOf(ev);
      if (ui.insertAt != null) { rows.splice(ui.insertAt, 0, { id: v, time: t }); ui.insertAt = null; }
      else rows.push({ id: v, time: t });
      commit();
    };
    bib.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); add(); }
    });
    time.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
    $$('input.cell').forEach(inp => inp.addEventListener('change', () => {
      const ev = currentEvent(); const r = resultsOf(ev)[+inp.dataset.i]; if (!r) return;
      r[inp.dataset.ed] = inp.value.trim(); commit();
    }));
    $$('input.cell').forEach(inp => inp.addEventListener('keydown', e => { if (e.key === 'Enter') inp.blur(); }));
  }
  function pasteResults() {
    const ev = currentEvent();
    const body = `<p class="small muted">Paste from the timing system or a spreadsheet: one finisher per line in finishing order. The bib and time columns are found automatically.</p>
      <textarea class="paste-zone" id="pr-text" placeholder="e.g.&#10;1	123	12:34&#10;2	87	12:40"></textarea>
      <div id="pr-info" class="small" style="margin-top:6px"></div>
      <div class="row" style="margin-top:8px"><label class="chk"><input type="radio" name="pr-mode" value="replace" checked> Replace current results</label><label class="chk"><input type="radio" name="pr-mode" value="append"> Add to the end</label></div>`;
    modal('Paste finish list — ' + eventLabel(ev), body, {
      wide: true, footer: '<button class="btn" data-c>Cancel</button><button class="btn primary" data-ok disabled>Use these results</button>', onMount: m => {
        let parsed = [];
        const ta = $('#pr-text', m.body); ta.focus();
        const analyse = () => {
          const rows = X.parseDelimited(ta.value).filter(r => r.some(Boolean));
          const width = Math.max(0, ...rows.map(r => r.length));
          let bibCol = -1, timeCol = -1;
          const stats = [];
          for (let j = 0; j < width; j++) {
            const vals = rows.map(r => r[j] || '').filter(Boolean);
            const nums = vals.filter(v => /^\d+$/.test(v)).map(Number);
            let seq = 0; for (let k = 1; k < nums.length; k++) if (nums[k] === nums[k - 1] + 1) seq++;
            const ids = byId(); const known = vals.filter(v => ids.has(v)).length;
            stats.push({ j, num: nums.length / (vals.length || 1), seq: nums.length > 2 ? seq / (nums.length - 1) : 0, time: vals.filter(v => /^\d{1,2}:\d{2}(:\d{2})?([.,]\d+)?$/.test(v)).length / (vals.length || 1), known: known / (vals.length || 1) });
          }
          const numCols = stats.filter(s => s.num > 0.8);
          const best = numCols.filter(s => !(s.seq > 0.9 && numCols.length > 1)).sort((a, b) => b.known - a.known || a.j - b.j)[0] || numCols[0];
          if (best) bibCol = best.j;
          const tc = stats.filter(s => s.time > 0.6).sort((a, b) => b.time - a.time)[0]; if (tc) timeCol = tc.j;
          parsed = bibCol < 0 ? [] : rows.filter(r => /^\d+$/.test(r[bibCol] || '')).map(r => ({ id: r[bibCol], time: timeCol >= 0 ? r[timeCol] || '' : '' }));
          const ids = byId();
          $('#pr-info', m.body).innerHTML = parsed.length ? `Found <b>${parsed.length}</b> finishers — bib numbers from column ${bibCol + 1}${timeCol >= 0 ? `, times from column ${timeCol + 1}` : ''}. ${parsed.filter(p => !ids.has(p.id)).length ? `<span style="color:var(--err)">${parsed.filter(p => !ids.has(p.id)).length} numbers are not entered athletes.</span>` : ''}` : ta.value.trim() ? '<span style="color:var(--err)">No bib numbers found.</span>' : '';
          $('[data-ok]', m.el).disabled = !parsed.length;
        };
        ta.addEventListener('input', analyse);
        $('[data-c]', m.el).onclick = m.close;
        $('[data-ok]', m.el).onclick = () => {
          const mode = $('[name=pr-mode]:checked', m.body).value;
          if (mode === 'replace') S.results[ev.number] = parsed; else resultsOf(ev).push(...parsed);
          m.close(); commit(); toast(`${parsed.length} finishers added`);
        };
      },
    });
  }
  function resultsReport(ev) {

  function resultsSheet(ev) {

    rows.push([{ v: `Event ${ev.number} ${ev.distance} ${ev.categories.join('/')}`, h: true }]);
    bold.add(rows.length); rows.push(['Pos', 'No.', 'Name', 'Club', 'Scoring Team', 'County', 'Province', 'Age Category', 'Time']);
    sc.lines.forEach(l => rows.push([l.pos ?? '', /^\d+$/.test(l.id) ? +l.id : l.id, l.entry ? l.entry.name : l.error, l.entry ? l.entry.team : '', l.entry ? l.entry.scoringTeam || l.entry.team : '', l.entry ? l.entry.county : '', l.entry ? l.entry.province : '', l.entry ? l.entry.category : '', l.time]));
    const teams = (list, label, col) => { if (!list.length) return; rows.push([]); rows.push([{ v: label, h: true }]); bold.add(rows.length); rows.push(['Place', col, 'Positions', 'Points']); list.forEach(t => rows.push([t.place, t.name, t.positions.join(', '), t.points])); };
    const multi = ev.categories.length > 1;
    for (const g of sc.groups) {
      if (multi) { rows.push([]); rows.push([{ v: g.category, h: true }]); bold.add(rows.length); rows.push(['Pos', 'No.', 'Name', 'Club', 'Overall']); g.results.forEach(r => rows.push([r.pos, r.entry.id, r.entry.name, r.entry.team, r.overall])); }
      const pre = multi ? g.category + ' ' : '';
      teams(g.teams.club, pre + 'Club Team Points', 'Club'); teams(g.teams.county, pre + 'County Team Points', 'County'); teams(g.teams.province, pre + 'Province Team Points', 'Province');
    }
    for (const mt of sc.masters) { teams(mt.club, mt.category + ' Club Team Points', 'Club'); teams(mt.county, mt.category + ' County Team Points', 'County'); }
    return { name: `E${ev.number} ${ev.categories[0]}`, rows, bold, widths: [7, 8, 28, 30, 30, 12, 12, 18, 10] };
  }

  function pasteClubs() {

          for (const r of rows) {

            const ex = S.teams.find(t => X.lc(t.name) === X.lc(r[0]));
            if (ex) { if (county) ex.county = county; if (prov) ex.province = prov; if (email) ex.email = email; upd++; }
            else { S.teams.push({ name: r[0], code: '', county, province: prov, email }); add++; }
          }
          S.teams.sort((a, b) => a.name.localeCompare(b.name));
          m.close(); commit(); toast(`${add} clubs added, ${upd} updated`);
        };
      },
    });
  }

  // ================================================================ actions
  const actions = {
    'meet-new'() { newMeetDialog(); },
    'meet-open'(el) { openMeet(el.dataset.id); },
    'meet-copy'(el) { newMeetDialog(el.dataset.id); },
    'meet-copy-cur'() { flushSave().then(() => newMeetDialog(S.id)); },
    async 'meet-export'(el) { await flushSave(); const d = await DB.get(el.dataset.id); if (d) exportMeetFile(migrate(d)); },
    async 'meet-export-cur'() { await flushSave(); exportMeetFile(S); },
    'meet-import'() { pickImportMeet(); },
    'meet-import-xlsx'() { pickWorkbook(); },
    'sync-open'() { syncDialog(); },
    'upd-check'() { updateCheck(true); },
    'upd-install'() { installUpdate(); },
    'upd-pill'() { if (Upd.state === 'ready') installUpdate(); else { ui.tab = 'meets'; render(); } },
    'upd-notes'() { if (isApp) invoke('open_releases').catch(() => {}); else window.open('https://github.com/flesheatingbug/meetmanager/releases/latest', '_blank'); },
    'meet-backup'() { backupAll(); },
    async 'meet-del'(el) {
      const m = summaries.find(x => x.id === el.dataset.id); if (!m) return;
      if (!confirm(`Delete “${m.title}”${m.date ? ' (' + fmtDate(m.date) + ')' : ''}?\n\nIts ${m.athletes} athletes and ${m.finishers} results will be removed. This can't be undone — export it first if you might need it.`)) return;
      if (S && S.id === m.id) { clearTimeout(saveTimer); S = null; dirty = false; localStorage.removeItem(LS_LAST); }
      await DB.del(m.id); await refreshSummaries(); ui.tab = 'meets'; render(); toast('Deleted ' + m.title); syncSoon(500);
    },
    'meet-del-cur'(el) { actions['meet-del']({ dataset: { id: S.id } }); },
    'export-all'() {
      const sheets = [
        { name: 'Competition', rows: [[{ v: S.settings.title, h: true }], ['Venue', S.settings.venue], ['Date', S.settings.date], ['Time', S.settings.time], ['Level', S.settings.regionLevel], ['Region', S.settings.region], [], ['Event', 'Categories', 'Type', 'Distance', 'Time', 'Entered', 'Finishers'], ...S.program.map(p => [p.number, p.categories.join(' / '), p.type, p.distance, p.time, entriesFor(p).length, (S.results[p.number] || []).length])], bold: new Set([7]), widths: [12, 40, 8, 12, 10, 10, 10] },
        entriesSheet(), bookletSheet(), clubListSheet(), checkInSheet(),
        ...S.program.filter(p => (S.results[p.number] || []).length).map(resultsSheet),
      ];
      downloadXlsx(S.settings.title, sheets);
    },
    // program
    'prog-add'() { const n = Math.max(0, ...S.program.map(p => +p.number || 0)) + 1; S.program.push({ number: n, categories: [], type: 'CC', distance: '', time: '' }); commit(); },
    'prog-quick': progQuick,
    'prog-del'(el) { const p = S.program[+el.dataset.i]; if ((S.results[p.number] || []).length && !confirm('This race has results. Delete it and its results?')) return; delete S.results[p.number]; S.program.splice(+el.dataset.i, 1); commit(); },
    'prog-up'(el) { const i = +el.dataset.i; [S.program[i - 1], S.program[i]] = [S.program[i], S.program[i - 1]]; commit(); },
    'prog-down'(el) { const i = +el.dataset.i; [S.program[i + 1], S.program[i]] = [S.program[i], S.program[i + 1]]; commit(); },
    'prog-delcat'(el) { S.program[+el.dataset.i].categories.splice(+el.dataset.ci, 1); commit(); },
    'prog-print'() { printHtml(programReport()); },
    // entries
    'ent-paste'() { importDialog(); },
    'ent-file'() { pickImportFile((rows, name) => importDialog(rows, name)); },
    'ent-add'() { editAthlete(null); },
    'ent-problems'() { ui.onlyProblems = !ui.onlyProblems; render(); },
    'ent-issues': showIssues,
    'ent-autofix'() {
      const f = autoFixes();
      const body = `<p class="small muted">These values only differ from the reference lists in capitals, punctuation or spacing.</p><table class="t small"><thead><tr><th>Athlete</th><th>Field</th><th>From</th><th>To</th></tr></thead><tbody>${f.map(x => `<tr><td>${esc(x.e.name)}</td><td>${esc(x.field)}</td><td>${esc(x.from)}</td><td><b>${esc(x.to)}</b></td></tr>`).join('')}</tbody></table>`;
      modal(`Fix ${f.length} spelling differences`, body, { wide: true, footer: '<button class="btn" data-c>Cancel</button><button class="btn primary" data-ok>Apply fixes</button>', onMount: m => {
        $('[data-c]', m.el).onclick = m.close;
        $('[data-ok]', m.el).onclick = () => { for (const x of f) { x.e[x.field] = x.to; if (x.field === 'scoringTeam' && x.e.scoringTeam === x.e.team) x.e.scoringTeam = ''; } m.close(); commit(); toast(`Fixed ${f.length} values`); };
      } });
    },
    'ent-delsel'() { if (!confirm(`Delete ${ui.sel.size} athletes?`)) return; S.entries = S.entries.filter(e => !ui.sel.has(e.uid)); ui.sel.clear(); commit(); },
    'ent-clearsel'() { ui.sel.clear(); render(); },
    'ent-bulk': bulkEdit,
    'ent-renumber': renumber,
    'ent-email'() {
      const list = filteredEntries();
      const club = ui.fTeam || (new Set(list.map(e => e.team)).size === 1 ? list[0] && list[0].team : '');
      const t = club && derive().teamByName.get(club);
      emailList(list, { club: club || '', to: (t && t.email) || '' });
    },
    'list-email'() { emailClubsDialog(); },
    'ent-export'() { downloadXlsx(S.settings.title + ' - athletes', [entriesSheet()]); },
    // lists
    'list-tab'(el) { ui.listTab = el.dataset.k; render(); },
    'list-print'() { printHtml({ booklet: bookletReport, clubs: clubListReport, checkin: checkInReport, program: programReport }[ui.listTab]()); },
    'list-xlsx'() { const s = { booklet: bookletSheet, clubs: clubListSheet, checkin: checkInSheet }[ui.listTab](); downloadXlsx(S.settings.title + ' - ' + s.name, [s]); },
    'list-csv'() { const s = { booklet: bookletSheet, clubs: clubListSheet, checkin: checkInSheet }[ui.listTab](); downloadCsv(S.settings.title + ' - ' + s.name, s.rows); },
    // results
    'res-evt'(el) { ui.evt = el.dataset.n; ui.insertAt = null; render(); },
    'res-add'() { const bib = $('#bib'); bib.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' })); },
    'res-undo'() { const r = resultsOf(currentEvent()); r.pop(); commit(); },
    'res-clear'() { if (confirm('Clear all results for this race?')) { S.results[currentEvent().number] = []; commit(); } },
    'res-up'(el) { const r = resultsOf(currentEvent()); const i = +el.dataset.i; [r[i - 1], r[i]] = [r[i], r[i - 1]]; commit(); },
    'res-down'(el) { const r = resultsOf(currentEvent()); const i = +el.dataset.i; [r[i + 1], r[i]] = [r[i], r[i + 1]]; commit(); },
    'res-del'(el) { resultsOf(currentEvent()).splice(+el.dataset.i, 1); commit(); },
    'res-ins'(el) { ui.insertAt = +el.dataset.i; render(); },
    'res-insx'() { ui.insertAt = null; render(); },
    'res-paste': pasteResults,
    'res-print'() { printHtml(resultsReport(currentEvent())); },
    'res-print-all'() { const evs = S.program.filter(p => (S.results[p.number] || []).length); if (!evs.length) { toast('No results yet', true); return; } printHtml(evs.map((ev, i) => `<div class="${i < evs.length - 1 ? 'page-break' : ''}">${resultsReport(ev)}</div>`).join('')); },
    'res-xlsx'() { const ev = currentEvent(); downloadXlsx(`${S.settings.title} - Event ${ev.number} results`, [resultsSheet(ev)]); },
    'res-addath'(el) { const ev = currentEvent(); editAthlete(null, { id: +el.dataset.id, category: ev.categories.length === 1 ? ev.categories[0] : '' }); },
    // setup
    'setup-tab'(el) { ui.setupTab = el.dataset.k; render(); },
    'cat-add'() { S.ageCategories.unshift({ name: 'New category ' + (S.ageCategories.length + 1), code: '', gender: '', age: null, dobFrom: null, dobTo: null, ccDistance: '', rrDistance: '', cc: { club: 4, clubMulti: false, county: 6, countyMulti: false, province: 6, provinceMulti: false }, rr: { club: 4, clubMulti: false, county: 6, countyMulti: false, province: 6, provinceMulti: false }, noOwnRanking: false, scoresIn: [] }); commit(); },
    'cat-del'(el) { const c = S.ageCategories[+el.dataset.i]; const n = S.entries.filter(e => e.category === c.name).length; if (n && !confirm(`${n} athletes use "${c.name}". Delete it anyway?`)) return; S.ageCategories.splice(+el.dataset.i, 1); commit(); },
    'club-add'() { newClubDialog('', (name, county, province) => { if (S.teams.some(t => t.name === name)) { toast('That club already exists', true); return; } S.teams.push({ name, code: '', county, province }); S.teams.sort((a, b) => a.name.localeCompare(b.name)); ui.clubQ = name; commit(); }); },
    'club-del'(el) { const t = S.teams[+el.dataset.i]; const n = S.entries.filter(e => e.team === t.name).length; if (n && !confirm(`${n} athletes are in ${t.name}. Delete the club anyway?`)) return; S.teams.splice(+el.dataset.i, 1); commit(); },
    'club-paste': pasteClubs,
    'alias-clear'() { S.aliases = {}; commit(); },
    'ref-save'() { localStorage.setItem(LS_REF, JSON.stringify({ ageCategories: S.ageCategories, mastersTeamCategories: S.mastersTeamCategories, teams: S.teams, counties: S.counties, provinces: S.provinces, aliases: S.aliases })); toast('Saved as the default for new competitions'); },
    'ref-reset'() { if (!confirm('Replace this competition’s categories, clubs and counties with the built-in data? Athletes keep their current values.')) return; localStorage.removeItem(LS_REF); const r = clone(SEED); Object.assign(S, { ageCategories: r.ageCategories, mastersTeamCategories: r.mastersTeamCategories, teams: r.teams, counties: r.counties, provinces: r.provinces }); commit(); },
  };

  // ================================================================ global wiring
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act]');
    if (t && actions[t.dataset.act] && t.tagName !== 'SELECT') { e.preventDefault(); actions[t.dataset.act](t); return; }
    const tab = e.target.closest('#tabs [data-tab]');
    if (tab) { ui.tab = tab.dataset.tab; ui.insertAt = null; render(); $('#view').scrollTop = 0; }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.matches('[data-act="prog-addcat"]')) { if (t.value) { const p = S.program[+t.dataset.i]; if (!p.categories.includes(t.value)) p.categories.push(t.value); if (!p.distance) { const c = derive().catByName.get(t.value); if (c) p.distance = p.type === 'RR' ? c.rrDistance : c.ccDistance; } commit(); } return; }
    if (t.matches('[data-pf]')) {
      const p = S.program[+t.dataset.i]; const k = t.dataset.pf; let v = t.value.trim();
      if (k === 'number') {
        v = +v; if (S.program.some(x => x !== p && +x.number === v)) { toast('Event numbers must be unique', true); t.value = p.number; return; }
        if (S.results[p.number]) { S.results[v] = S.results[p.number]; delete S.results[p.number]; }
      }
      p[k] = v; commit({ render: k === 'number' }); return;
    }
    if (t.matches('[data-set]')) {
      const k = t.dataset.set; S.settings[k] = t.type === 'checkbox' ? t.checked : t.type === 'number' ? +t.value : t.value;
      commit({ render: k === 'regionLevel' }); return;
    }
  });
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); if (S) { dirty = true; flushSave().then(() => toast('Saved')); } }
  });
  $('#file-open').addEventListener('change', async e => { for (const f of e.target.files) await importText(await f.text(), f.name); e.target.value = ''; });
  window.addEventListener('beforeunload', e => { if (dirty || saving) { flushSave(); e.preventDefault(); e.returnValue = ''; } });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSave(); });
  // paste anywhere on the athletes tab opens the importer
  document.addEventListener('paste', e => {
    if (ui.tab !== 'entries' || $('#modal-root').children.length) return;
    if (e.target && e.target.closest && e.target.closest('input,textarea,select')) return;
    const html = e.clipboardData.getData('text/html'), text = e.clipboardData.getData('text/plain');
    let rows = null;
    if (html) { try { rows = X.parseHtmlTables(html); } catch (err) { rows = null; } }
    if (!rows || !rows.length) rows = X.parseDelimited(text);
    if (!rows.some(r => r.some(Boolean))) return;
    e.preventDefault();
    importDialog(rows, 'Pasted');
  });

  // ================================================================ boot
  (async () => {
    try {
      await DB.open();
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
      // bring across the single autosaved meet from version 1.0
      try {
        const old = JSON.parse(localStorage.getItem(LS_CUR));
        if (old && old.state) { const st = migrate(old.state); if (!st.entries.length && !st.program.length) throw 0; await DB.put(st); localStorage.setItem(LS_LAST, st.id); }
      } catch (e) { /* nothing to migrate */ }
      localStorage.removeItem(LS_CUR);
      await refreshSummaries();
      const last = localStorage.getItem(LS_LAST);
      if (last && summaries.some(m => m.id === last)) { const d = await DB.get(last); S = migrate(d); ui.tab = 'meets'; }
    } catch (e) {
      $('#view').innerHTML = `<div class="wrap"><div class="notice err">Could not open the meets database: ${esc(e.message || e)}. Make sure you open the app with the launcher.</div></div>`;
      return;
    }
    window.XCApp = { get state() { return S; }, actions, ui, render, importDialog, get summaries() { return summaries; }, flushSave, syncNow, Sync };
    render();
    startSync();
    startUpdates();
  })();
})();
</script>
</body>
</html>
