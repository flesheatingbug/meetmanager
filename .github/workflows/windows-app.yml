name: Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'app/README.txt']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release (tag v<version> from src-tauri/tauri.conf.json)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tests
        run: node tests/run.js

      - name: Build web app
        run: python build.py

      - name: Build Windows installer
        run: npx --yes @tauri-apps/cli@^2 build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: XC-Meet-Manager-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "tag=v$v" >> $env:GITHUB_OUTPUT

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: XC Meet Manager ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
