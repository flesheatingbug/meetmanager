name: Windows app

# Every push to main builds the installer and publishes it to the rolling
# "latest-windows" release (fixed file names), which the app checks for updates.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'app/README.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-app
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Tests
        run: node tests/run.js

      - name: Stamp version (major.minor from tauri.conf.json, patch = build number)
        shell: bash
        run: |
          BASE=$(node -p "require('./src-tauri/tauri.conf.json').version")
          VERSION="${BASE%.*}.${{ github.run_number }}"
          node -e "const f='src-tauri/tauri.conf.json',j=JSON.parse(require('fs').readFileSync(f,'utf8'));j.version='$VERSION';require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" src-tauri/Cargo.toml
          sed -i "s/const APP_VERSION = '[^']*';/const APP_VERSION = '$VERSION';/" src/app.js
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building version $VERSION"

      - name: Build web app
        run: python build.py

      - name: Build Windows installer
        run: npx --yes @tauri-apps/cli@^2 build

      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p release
          cp src-tauri/target/release/bundle/nsis/*-setup.exe release/XC-Organiser-setup.exe
          SHA=$(sha256sum release/XC-Organiser-setup.exe | cut -d' ' -f1)
          SIZE=$(stat -c%s release/XC-Organiser-setup.exe)
          URL="https://github.com/${{ github.repository }}/releases/download/latest-windows/XC-Organiser-setup.exe"
          node -e "require('fs').writeFileSync('release/latest.json', JSON.stringify({version:'$VERSION', url:'$URL', sha256:'$SHA', size:$SIZE, commit:'${GITHUB_SHA::7}', published:new Date().toISOString()}, null, 2))"
          cat release/latest.json

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: XC-Organiser-Windows
          path: release/*

      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then RANGE="$BEFORE..HEAD"; else RANGE="-n 10"; fi
          {
            echo "## XC Organiser $VERSION"
            echo
            echo "**[Download XC-Organiser-setup.exe](https://github.com/${{ github.repository }}/releases/download/latest-windows/XC-Organiser-setup.exe)**. Already installed? The app updates itself."
            echo
            echo "### Changes"
            git log $RANGE --pretty='format:- %s (%h)'
            echo
            echo
            cat RELEASE_NOTES.md
          } > notes.md
          gh release delete latest-windows --cleanup-tag -y || true
          gh release create latest-windows release/XC-Organiser-setup.exe release/latest.json \
            --title "XC Organiser $VERSION" --notes-file notes.md --target "$GITHUB_SHA" --latest
